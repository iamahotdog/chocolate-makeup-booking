<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chocolate 預約管理</title>
<style>
:root{--bg:#fff8f3;--card:#fff;--ink:#4b2d22;--muted:#98786b;--brown:#74452f;--brown2:#5b3424;--line:#ead7cc;--soft:#f8eee8;--green:#eaf5ee;--greenInk:#2f6d44;--red:#fff0ed;--redInk:#a64c40;--shadow:0 12px 30px rgba(74,44,31,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
button,input{font:inherit}
body{padding-bottom:max(28px,env(safe-area-inset-bottom))}
.app{width:min(100%,520px);margin:auto}
.head{position:sticky;top:0;z-index:20;padding:18px 16px 13px;background:rgba(255,248,243,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(234,215,204,.7)}
.brand{font:italic 27px Georgia,serif}.sub{margin-top:2px;color:var(--muted);font-size:11px;letter-spacing:.12em}
.login{padding:24px 16px}.loginCard{padding:22px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:var(--shadow)}.loginCard h1{margin:0 0 6px;font-size:23px}.loginCard p{margin:0 0 17px;color:var(--muted);font-size:13px;line-height:1.65}
.control{width:100%;padding:13px 14px;border:1px solid #dcc3b5;border-radius:14px;background:#fff;font-size:16px;outline:0}
.primary{width:100%;margin-top:11px;border:0;border-radius:14px;padding:13px;background:linear-gradient(#7b5039,#613928);color:#fff;font-weight:800;box-shadow:0 3px 0 #45291e}
.primary:active{transform:translateY(3px);box-shadow:none}
.dashboard{display:none}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:13px 12px 5px}.tab{border:1px solid var(--line);border-radius:999px;padding:9px 5px;background:#fff;color:var(--muted);font-size:11px;font-weight:800}.tab.active{background:var(--brown);border-color:var(--brown);color:#fff}
.summary{padding:5px 16px 8px;color:var(--muted);font-size:12px}
.list{padding:0 12px}.booking{margin:10px 0;padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:var(--shadow)}.top{display:flex;gap:10px;align-items:flex-start}.time{flex:0 0 76px;font-size:22px;font-weight:850;line-height:1.15}.date{display:block;margin-top:3px;color:var(--muted);font-size:10px;font-weight:600}.main{min-width:0;flex:1}.service{font-size:16px;font-weight:850}.name{margin-top:4px;font-size:13px}.status{display:inline-block;margin-top:7px;padding:5px 8px;border-radius:999px;background:#f6eee9;color:#745547;font-size:10px;font-weight:800}.status.confirmed{background:var(--green);color:var(--greenInk)}.status.released{background:#f1efee;color:#81736d}
.details{margin-top:13px;padding:12px 13px;border-radius:14px;background:#fff9f6;color:#775b4f;font-size:12px;line-height:1.7}.details b{color:var(--ink)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.btn{border:0;border-radius:13px;padding:11px 9px;font-size:12px;font-weight:850}.confirm{background:var(--brown);color:#fff}.release{background:#f8e7e2;color:#94493c}.restore{background:#f3ebe6;color:#6d5044}.wide{grid-column:1/-1}
.empty{margin:40px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
.loading{padding:35px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;z-index:99;transform:translateX(-50%) translateY(30px);opacity:0;pointer-events:none;transition:.2s;padding:10px 14px;border-radius:999px;background:#4c3228;color:#fff;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(50,32,23,.48);backdrop-filter:blur(3px)}.modal.show{display:flex}.modalCard{width:min(100%,350px);padding:21px;border-radius:22px;background:#fff;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.2)}.modalCard h3{margin:0 0 8px;font-size:20px}.modalCard p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}.modalActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}.modalActions button{border:0;border-radius:13px;padding:11px;font-weight:800}.cancel{background:#f4ece7;color:#76584b}.ok{background:var(--brown);color:#fff}
.vacationBox{padding:4px 12px 7px}.vacationToggle{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px;background:#fff;color:var(--brown);font-weight:850}.vacationPanel{display:none;margin-top:9px;padding:12px;border:1px solid var(--line);border-radius:17px;background:#fff}.vacationPanel.show{display:block}.vacationRow{display:grid;grid-template-columns:1fr 100px;gap:8px}.closedDaysList{margin-top:9px}.closedDay{display:flex;align-items:center;justify-content:space-between;padding:9px 4px;border-top:1px solid #f1e5de;font-size:12px}.closedDay button{border:0;background:#f8e7e2;color:#94493c;border-radius:10px;padding:7px 9px;font-weight:800}

.managerNav{
  position:sticky;
  top:72px;
  z-index:18;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  padding:11px 12px;
  background:rgba(255,248,243,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(234,215,204,.7);
}
.managerNavBtn{
  min-width:0;
  border:1px solid var(--line);
  border-radius:17px;
  padding:11px 12px;
  background:#fff;
  color:var(--muted);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  text-align:left;
  box-shadow:0 4px 12px rgba(74,44,31,.04);
}
.managerNavBtn .navIcon{
  flex:0 0 30px;
  width:30px;
  height:30px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:var(--soft);
  color:var(--brown);
  font-size:17px;
}
.managerNavBtn b{
  display:block;
  color:inherit;
  font-size:13px;
  line-height:1.15;
}
.managerNavBtn small{
  display:block;
  margin-top:3px;
  font-size:9.5px;
  font-weight:650;
  opacity:.8;
}
.managerNavBtn.active{
  background:var(--brown);
  border-color:var(--brown);
  color:#fff;
  box-shadow:0 4px 0 var(--brown2);
}
.managerNavBtn.active .navIcon{
  background:rgba(255,255,255,.16);
  color:#fff;
}
.managerNavBtn:active{
  transform:translateY(2px);
}

.managerPage.hidden{display:none}
.pageIntro{padding:10px 16px 4px}
.pageIntro h1{margin:0;font-size:22px}
.pageIntro p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.6}
.vacationCard{
  margin:12px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:22px;
  background:#fff;
  box-shadow:var(--shadow)
}
.monthBar{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px}
.monthBtn{border:0;border-radius:12px;padding:9px;background:var(--soft);color:var(--brown);font-size:20px}
.monthLabel{text-align:center;font-size:17px;font-weight:850}
.weekHead,.calendarGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.weekHead{margin:16px 0 8px;color:var(--muted);font-size:10px;text-align:center}
.dayBtn{
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  aspect-ratio:1/1;
  border:1px solid #eee0d7;
  border-radius:13px;
  background:#fff;
  color:var(--ink);
  font-weight:750;
}
.dayBtn.other{opacity:.28}
.dayBtn.closed{
  background:#f5e6de;
  border-color:#debbaa;
  color:#8f4e3e;
}
.dayBtn.selected{
  outline:2px solid var(--brown);
  outline-offset:1px;
}
.dayBtn.today::after{
  content:"";
  display:block;
  width:4px;height:4px;border-radius:50%;
  background:var(--brown);
  margin:3px auto 0;
}
.selectionHint{margin:15px 0 10px;text-align:center;color:var(--muted);font-size:12px}
.bulkActions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.bulkBtn{border:0;border-radius:14px;padding:12px;font-weight:850}
.closeDays{background:var(--brown);color:#fff}
.openDays{background:#f7e8e2;color:#954f40}

</style>
</head>
<body>
<main class="app">
<header class="head"><div class="brand">Chocolate</div><div class="sub">BOOKING MANAGER</div></header>

<section id="login" class="login">
  <div class="loginCard">
    <h1>巧克力預約管理 ♡</h1>
    <p>巧克力手機管理頁。確認訂金、釋放時段與休假設定都可以直接在這裡完成。</p>
    <input id="adminKey" class="control" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="current-password" placeholder="輸入管理密碼">
    <button class="primary" onclick="loginAdmin()">進入預約管理</button>
  </div>
</section>


<section id="dashboard" class="dashboard">
  <nav class="managerNav" aria-label="管理功能切換">
    <button id="navBookings" class="managerNavBtn active" onclick="showManagerPage('bookings')">
      <span class="navIcon">♡</span>
      <span><b>預約管理</b><small>訂金・時段</small></span>
    </button>
    <button id="navVacation" class="managerNavBtn" onclick="showManagerPage('vacation')">
      <span class="navIcon">☾</span>
      <span><b>休假設定</b><small>整日不開放</small></span>
    </button>
  </nav>

  <section id="bookingsPage" class="managerPage">
    <div class="pageIntro">
      <h1>預約管理</h1>
      <p>查看目前預約，確認訂金或釋放時段。</p>
    </div>

    <div class="tabs">
      <button class="tab active" data-filter="pending" onclick="setFilter('pending',this)">待訂金</button>
      <button class="tab" data-filter="confirmed" onclick="setFilter('confirmed',this)">已確認</button>
      <button class="tab" data-filter="today" onclick="setFilter('today',this)">今日</button>
      <button class="tab" data-filter="released" onclick="setFilter('released',this)">已釋放</button>
    </div>
    <div id="summary" class="summary"></div>
    <div id="list" class="list"></div>
  </section>

  <section id="vacationPage" class="managerPage hidden">
    <div class="pageIntro">
      <h1>休假日設定</h1>
      <p>直接在月曆多選日期，再一次設定休假或恢復開放。</p>
    </div>

    <div class="vacationCard">
      <div class="monthBar">
        <button class="monthBtn" onclick="shiftVacationMonth(-1)">‹</button>
        <div id="vacationMonthLabel" class="monthLabel"></div>
        <button class="monthBtn" onclick="shiftVacationMonth(1)">›</button>
      </div>

      <div class="weekHead">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div id="vacationCalendar" class="calendarGrid"></div>

      <div class="selectionHint">
        已選 <b id="selectedCount">0</b> 天
      </div>

      <div class="bulkActions">
        <button class="bulkBtn closeDays" onclick="applyVacationBulk('close')">設為休假</button>
        <button class="bulkBtn openDays" onclick="applyVacationBulk('open')">恢復開放</button>
      </div>
    </div>
  </section>
</section>
</main>

<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="modalCard"><h3 id="modalTitle"></h3><p id="modalText"></p><div class="modalActions"><button class="cancel" onclick="hideModal()">先等等</button><button id="modalOk" class="ok">確定</button></div></div></div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbxi5rwWSixQ7qAH39WSwfI6EQVkUgKRrAkVR7btnLeq_8LaOWFtmrhr0QM7FkNrDQHPSA/exec';
let adminKey=sessionStorage.getItem('choco_admin_key')||'';
let filter='pending';
let pendingAction=null;
let loadSeq=0;

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb='adm_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const cleanup=()=>{delete window[cb];s.remove()};
    window[cb]=(data)=>{cleanup();resolve(data)};
    s.onerror=()=>{cleanup();reject(new Error('連線失敗'))};
    s.src=API_URL+'?'+new URLSearchParams({...params,callback:cb}).toString();
    document.body.appendChild(s);
    setTimeout(()=>{if(window[cb]){cleanup();reject(new Error('連線逾時'))}},9000);
  });
}

document.getElementById('adminKey').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'')});

async function loginAdmin(){
  const key=document.getElementById('adminKey').value.trim();
  if(!key)return;
  adminKey=key;
  try{
    const r=await jsonp({action:'admin_list',adminKey,filter:'pending'});
    if(!r.ok && r.message)throw new Error(r.message);
    sessionStorage.setItem('choco_admin_key',adminKey);
    document.getElementById('login').style.display='none';
    document.getElementById('dashboard').style.display='block';
    render(r.items||[]);
  }catch(e){
    toast(e.message||'管理密碼錯誤');
  }
}


function adminLocalCacheGet(filter){
  try{
    const raw=sessionStorage.getItem('choco_list_'+filter);
    if(!raw)return null;
    const obj=JSON.parse(raw);
    if(Date.now()-obj.ts>30000)return null;
    return obj.items||[];
  }catch(_){return null}
}
function adminLocalCacheSet(filter,items){
  try{sessionStorage.setItem('choco_list_'+filter,JSON.stringify({ts:Date.now(),items}))}catch(_){}
}

async function load(){
  const list=document.getElementById('list');
  const cached=adminLocalCacheGet(filter);
  if(cached){
    render(cached);
  }else{
    list.innerHTML='<div class="loading">正在整理預約…</div>';
  }

  try{
    const r=await jsonp({action:'admin_list',adminKey,filter});
    if(!r.ok && r.message)throw new Error(r.message);
    const items=r.items||[];
    adminLocalCacheSet(filter,items);
    render(items);
  }catch(e){
    if(!cached) list.innerHTML='<div class="empty">'+escapeHtml(e.message||'讀取失敗')+'</div>';
    else toast('更新稍慢，先顯示最近資料');
  }
}

function setFilter(f,el){
  filter=f;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  load();
}

function render(items){
  document.getElementById('summary').textContent='共 '+items.length+' 筆';
  const list=document.getElementById('list');
  if(!items.length){
    list.innerHTML='<div class="empty">這裡目前沒有預約 ♡</div>';
    return;
  }
  list.innerHTML=items.map(card).join('');
}

function card(x){
  const cls=x.status==='已確認'?'confirmed':(['已釋放','已取消'].includes(x.status)?'released':'');
  let actionHtml='';
  if(['待訂金','討論中'].includes(x.status)){
    actionHtml=`<div class="actions">
      <button class="btn confirm" onclick="askAction('${js(x.id)}','confirm_deposit','${js(x.name)}')">✓ 已收訂金</button>
      <button class="btn release" onclick="askAction('${js(x.id)}','release','${js(x.name)}')">釋放時段</button>
    </div>`;
  } else if(x.status==='已確認'){
    actionHtml=`<div class="actions"><button class="btn release wide" onclick="askAction('${js(x.id)}','release','${js(x.name)}')">取消並釋放時段</button></div>`;
  } else {
    actionHtml=`<div class="actions"><button class="btn restore wide" onclick="askAction('${js(x.id)}','restore_pending','${js(x.name)}')">恢復為待訂金</button></div>`;
  }

  const place=x.area?x.location+'｜'+x.area:x.location;
  return `<article class="booking">
    <div class="top">
      <div class="time">${escapeHtml(x.time)}<span class="date">${escapeHtml(x.date.replaceAll('-','/'))}</span></div>
      <div class="main">
        <div class="service">${escapeHtml(x.service)}</div>
        <div class="name">${escapeHtml(x.name)}｜${escapeHtml(x.phone)}</div>
        <span class="status ${cls}">${escapeHtml(x.status)}</span>
      </div>
    </div>
    <div class="details">
      <b>預估服務至：</b>${escapeHtml(x.serviceEnd||'—')}<br>
      <b>開妝地點：</b>${escapeHtml(place||'—')}<br>
      ${x.note?'<b>需求：</b>'+escapeHtml(x.note):''}
    </div>
    ${actionHtml}
  </article>`;
}

function askAction(id,action,name){
  const map={
    confirm_deposit:['確認收到訂金？','確認後這個時段會正式鎖定，並由 LINE 官方帳號通知 '+name+' 預約已成立。'],
    release:['確定釋放時段？','釋放後，這個時間會立即重新開放給其他客人預約。'],
    restore_pending:['恢復待訂金？','這筆預約會重新占用原本時段，狀態改回待訂金。']
  };
  pendingAction={id,action};
  document.getElementById('modalTitle').textContent=map[action][0];
  document.getElementById('modalText').textContent=map[action][1];
  document.getElementById('modalOk').onclick=()=>{hideModal();runAction(id,action)};
  document.getElementById('modal').classList.add('show');
}
function hideModal(){document.getElementById('modal').classList.remove('show')}

async function runAction(id,action){
  toast('正在更新…');
  try{
    const r=await jsonp({
      action:'admin_action',
      adminKey,
      bookingId:id,
      adminAction:action,
      _ts:Date.now()
    });
    if(!r.ok) throw new Error(r.message||'更新失敗');

    const msg=[r.message,r.lineNotice].filter(Boolean).join(' ');
    toast(msg||'已更新');
    await load();
  }catch(e){
    toast(e.message||'更新失敗');
  }
}

function toast(t){
  const el=document.getElementById('toast');
  el.textContent=t;el.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),4200);
}


let managerPage='bookings';
let vacationCursor=new Date();
vacationCursor.setDate(1);
let selectedVacationDates=new Set();
let closedVacationDates=new Set();
let vacationMonthCache={};

function showManagerPage(page){
  managerPage=page;
  document.getElementById('bookingsPage').classList.toggle('hidden',page!=='bookings');
  document.getElementById('vacationPage').classList.toggle('hidden',page!=='vacation');
  document.getElementById('navBookings').classList.toggle('active',page==='bookings');
  document.getElementById('navVacation').classList.toggle('active',page==='vacation');
  if(page==='vacation') loadVacationMonth();
}

function shiftVacationMonth(delta){
  vacationCursor.setMonth(vacationCursor.getMonth()+delta);
  vacationCursor.setDate(1);
  selectedVacationDates.clear();
  const month=monthKey();
  closedVacationDates=new Set(vacationMonthCache[month]||[]);
  renderVacationCalendar();
  loadVacationMonth();
}

function monthKey(){
  return vacationCursor.getFullYear()+'-'+String(vacationCursor.getMonth()+1).padStart(2,'0');
}

async function loadVacationMonth(){
  const month=monthKey();
  const cached=vacationMonthCache[month];
  closedVacationDates=new Set(cached||[]);
  renderVacationCalendar();
  try{
    const r=await jsonp({action:'admin_closed_days',adminKey,month});
    const dates=(r.items||[]).map(x=>x.date);
    vacationMonthCache[month]=dates;
    closedVacationDates=new Set(dates);
    renderVacationCalendar();
  }catch(e){
    if(!cached) toast(e.message||'讀取休假日失敗');
  }
}

function renderVacationCalendar(){
  const year=vacationCursor.getFullYear();
  const month=vacationCursor.getMonth();
  document.getElementById('vacationMonthLabel').textContent=year+' 年 '+(month+1)+' 月';

  const first=new Date(year,month,1);
  const gridStart=new Date(year,month,1-first.getDay());
  const today=new Date();
  const todayKey=toDateKey(today);

  let html='';
  for(let i=0;i<42;i++){
    const d=new Date(gridStart);
    d.setDate(gridStart.getDate()+i);
    const key=toDateKey(d);
    const other=d.getMonth()!==month;
    const closed=closedVacationDates.has(key);
    const selected=selectedVacationDates.has(key);
    const cls=['dayBtn',other?'other':'',closed?'closed':'',selected?'selected':'',key===todayKey?'today':''].filter(Boolean).join(' ');
    html+=`<button class="${cls}" onclick="toggleVacationDate('${key}')">${d.getDate()}</button>`;
  }
  document.getElementById('vacationCalendar').innerHTML=html;
  document.getElementById('selectedCount').textContent=selectedVacationDates.size;
}

function toggleVacationDate(key){
  if(selectedVacationDates.has(key)) selectedVacationDates.delete(key);
  else selectedVacationDates.add(key);
  renderVacationCalendar();
}

function toDateKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

async function applyVacationBulk(mode){
  const dates=[...selectedVacationDates];
  if(!dates.length){toast('請先選日期');return}

  try{
    toast(mode==='close'?'正在設定休假…':'正在恢復開放…');
    await fetch(API_URL,{
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
      body:new URLSearchParams({
        action:'admin_vacation_bulk',
        adminKey,
        dates:JSON.stringify(dates),
        mode
      })
    });
    const month=monthKey();
    const current=new Set(vacationMonthCache[month]||[]);
    dates.forEach(d=>mode==='close'?current.add(d):current.delete(d));
    vacationMonthCache[month]=[...current];
    closedVacationDates=new Set(current);
    selectedVacationDates.clear();
    renderVacationCalendar();
    toast(mode==='close'?'已設定休假日':'已恢復開放');
  }catch(e){
    toast(e.message||'更新失敗');
  }
}

function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function js(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}

if(adminKey){
  document.getElementById('login').style.display='none';
  document.getElementById('dashboard').style.display='block';
  load();
}
</script>
